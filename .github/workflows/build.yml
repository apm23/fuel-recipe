name: build-fuel-recipe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Verify Java and Gradle
        run: |
          java -version
          gradle --version
      - name: Build
        run: gradle clean build --stacktrace
      - name: Dedicated server functional smoke test
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          echo 'online-mode=false' > run/server.properties
          set +e
          (
            sleep 25
            echo 'forceload add 0 0'
            echo 'fill 1 100 0 7 100 0 minecraft:amethyst_block'
            echo 'setblock 0 100 0 fuelrecipe:super_light'
            sleep 4
            echo 'execute if block 8 100 0 fuelrecipe:light_node_a run say LIGHT_NODE_OK'
            echo 'execute if block 8 100 0 fuelrecipe:light_node_b run say LIGHT_NODE_OK'
            echo 'setblock 0 100 0 minecraft:air'
            sleep 6
            echo 'execute unless block 8 100 0 fuelrecipe:light_node_a unless block 8 100 0 fuelrecipe:light_node_b run say LIGHT_CLEANUP_OK'
            echo 'stop'
          ) | timeout 55s gradle runServer --args='nogui' > /tmp/fuel-recipe-server.log 2>&1
          CODE=$?
          set -e
          cat /tmp/fuel-recipe-server.log
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 124 ]; then
            echo "Server exited unexpectedly with code $CODE"
            exit "$CODE"
          fi
          if grep -E -i 'mixin apply failed|failed to load recipe|parsing error|could not parse|exception.*fuelrecipe|crash report' /tmp/fuel-recipe-server.log; then
            echo 'Detected mod/resource loading error.'
            exit 1
          fi
          grep -q 'Done (' /tmp/fuel-recipe-server.log || { echo 'Server never reached ready state.'; exit 1; }
          grep -q 'LIGHT_NODE_OK' /tmp/fuel-recipe-server.log || { echo 'Wide-area light node did not appear behind the amethyst wall.'; exit 1; }
          grep -q 'LIGHT_CLEANUP_OK' /tmp/fuel-recipe-server.log || { echo 'Light node cleanup did not complete.'; exit 1; }
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: fuel-recipe-build
          path: build/libs/*.jar
