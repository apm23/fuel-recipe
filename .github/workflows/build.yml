name: build-fuel-recipe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Verify Java and Gradle
        run: |
          java -version
          gradle --version
      - name: Probe Furnace tick bytecode
        run: |
          gradle -q writeCompileClasspath
          CP="$(cat build/compile-classpath.txt)"
          javap -c -private -classpath "$CP" net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity
      - name: Build
        run: gradle clean build --stacktrace
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: fuel-recipe-build
          path: build/libs/*.jar
