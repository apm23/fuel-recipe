name: build-fuel-recipe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Verify Java and Gradle
        run: |
          java -version
          gradle --version
      - name: Build
        run: gradle clean build --stacktrace
      - name: Dedicated server functional smoke test
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          echo 'online-mode=false' > run/server.properties
          set +e
          (
            sleep 25
            echo 'forceload add 0 0 64 0'
            sleep 5
            echo 'say LIGHT_TEST_BEGIN'
            echo 'setblock 0 101 0 minecraft:amethyst_block'
            echo 'setblock 0 100 0 fuelrecipe:super_light'
            sleep 1
            echo 'execute if block 0 102 0 fuelrecipe:light_node_a run say BURIED_LIGHT_OK'
            sleep 4
            echo 'execute if block 60 100 0 fuelrecipe:light_node_a run say RADIUS_60_OK'
            echo 'setblock 0 100 0 minecraft:air'
            sleep 2
            echo 'execute unless block 0 102 0 fuelrecipe:light_node_a unless block 0 102 0 fuelrecipe:light_node_b run say LOCAL_CLEANUP_OK'
            echo 'execute unless block 60 100 0 fuelrecipe:light_node_a unless block 60 100 0 fuelrecipe:light_node_b run say FAR_CLEANUP_OK'
            echo 'stop'
          ) | timeout 70s gradle runServer --args='nogui' > /tmp/fuel-recipe-server.log 2>&1
          CODE=$?
          set -e
          cat /tmp/fuel-recipe-server.log
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 124 ]; then
            echo "Server exited unexpectedly with code $CODE"
            exit "$CODE"
          fi
          if grep -E -i 'mixin apply failed|failed to load recipe|parsing error|could not parse|exception.*fuelrecipe|crash report' /tmp/fuel-recipe-server.log; then
            echo 'Detected mod/resource loading error.'
            exit 1
          fi
          grep -q 'Done (' /tmp/fuel-recipe-server.log || { echo 'Server never reached ready state.'; exit 1; }
          grep -q 'BURIED_LIGHT_OK' /tmp/fuel-recipe-server.log || { echo 'Buried light failed to illuminate through the amethyst cap.'; exit 1; }
          grep -q 'RADIUS_60_OK' /tmp/fuel-recipe-server.log || { echo 'Super Light did not create a node at 60 blocks.'; exit 1; }
          grep -q 'LOCAL_CLEANUP_OK' /tmp/fuel-recipe-server.log || { echo 'Local light node cleanup failed.'; exit 1; }
          grep -q 'FAR_CLEANUP_OK' /tmp/fuel-recipe-server.log || { echo 'Far light node cleanup failed.'; exit 1; }
          awk '/LIGHT_TEST_BEGIN/{seen=1} seen' /tmp/fuel-recipe-server.log > /tmp/light-test-window.log
          if grep -q "Can't keep up!" /tmp/light-test-window.log; then
            echo 'Performance regression detected during light placement.'
            cat /tmp/light-test-window.log
            exit 1
          fi
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: fuel-recipe-build
          path: build/libs/*.jar
